[GLOBAL]
DEBUG = True
DEBUG_CONSOLE = True
DEBUG_TEMPLATE = True

INSTALLED_APPS = [
    'uliweb.contrib.staticfiles',
    'chatbot',
]

# Chatbot 配置 (独立 section)
# OpenAI 兼容 API 配置
# 支持: OpenAI, Ollama (http://localhost:11434), LocalAI 等
[CHATBOT]
openai_base_url = 'https://api.openai.com'    # API 基础地址
openai_api_key = ''                            # API Key
default_model = 'gpt-3.5-turbo'                # 默认模型
verify_ssl = True                              # 是否验证 SSL 证书（设为 False 可忽略证书错误）

# 如果使用本地 Ollama，可以改为:
# [CHATBOT]
# openai_base_url = 'http://localhost:11434'
# openai_api_key = ''
# default_model = 'llama2'
# verify_ssl = False

