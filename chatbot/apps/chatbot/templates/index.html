<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - LLM 聊天助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                         'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .transport-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 3px;
        }

        .transport-toggle button {
            padding: 5px 12px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            cursor: pointer;
            border-radius: 17px;
            transition: all 0.2s;
        }

        .transport-toggle button.active {
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
        }

        .transport-toggle button:hover:not(.active) {
            color: white;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .model-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .header .url-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
        }

        .chat-container {
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #667eea;
            color: white;
            margin-left: 12px;
        }

        .message.assistant .message-avatar {
            background: #764ba2;
            color: white;
            margin-right: 12px;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        /* 思考状态样式 */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .thinking-indicator:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .thinking-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 思考内容区域 - 可折叠 */
        .thinking-content {
            display: none;
            padding: 12px 18px;
            margin: 8px 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 8px;
            border-left: 3px solid #667eea;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #555;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }

        .thinking-content.expanded {
            display: block;
        }

        .thinking-content::-webkit-scrollbar {
            width: 6px;
        }

        .thinking-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .thinking-content::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 3px;
        }

        .expand-icon {
            transition: transform 0.2s;
            font-size: 12px;
        }

        .expand-icon.expanded {
            transform: rotate(90deg);
        }

        /* 回复内容区域 */
        .response-content {
            line-height: 1.6;
        }

        .response-content:empty::after {
            content: '正在输入...';
            color: #999;
            font-style: italic;
        }

        @keyframes typing {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        .input-container input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-container input:focus {
            border-color: #667eea;
        }

        .input-container button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .input-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .connection-status {
            padding: 10px 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .clear-btn {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Chatbot</h1>
            <div class="header-controls">
                <div class="transport-toggle">
                    <button id="wsBtn" class="active" onclick="setTransport('websocket')">WebSocket</button>
                    <button id="sseBtn" onclick="setTransport('sse')">SSE</button>
                </div>
                <div class="header-info">
                    <span class="url-badge" title="API URL: {{= base_url}}">{{= display_url}}</span>
                    <span class="model-badge" title="Model">{{= model}}</span>
                </div>
                <button class="clear-btn" onclick="clearChat()">清空对话</button>
            </div>
        </div>

        <div class="connection-status" id="status">
            <span class="status-dot"></span>
            <span id="statusText">正在连接...</span>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <p>发送消息开始聊天</p>
                </div>
            </div>

            <div class="input-container">
                <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let isConnected = false;
        let messageCount = 0;
        let currentTransport = localStorage.getItem('chatTransport') || 'websocket';  // 当前传输方式，从 localStorage 读取
        let sse = null;  // SSE EventSource
        let welcomeShown = false;  // 欢迎句是否已显示

        // 获取 WebSocket URL
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + '//' + window.location.host + '/ws/chat';

        // 页面加载时应用保存的传输方式
        function initTransportUI() {
            document.getElementById('wsBtn').classList.toggle('active', currentTransport === 'websocket');
            document.getElementById('sseBtn').classList.toggle('active', currentTransport === 'sse');
        }

        // 切换传输方式
        function setTransport(transport) {
            console.log('setTransport: switching from', currentTransport, 'to', transport);
            if (transport === currentTransport) return;

            // 断开当前连接
            disconnect();

            // 更新 UI
            currentTransport = transport;
            document.getElementById('wsBtn').classList.toggle('active', transport === 'websocket');
            document.getElementById('sseBtn').classList.toggle('active', transport === 'sse');

            // 保存选择到 localStorage
            localStorage.setItem('chatTransport', transport);

            // 清空聊天记录
            clearChatDisplay();

            // 连接新方式
            connect();
            console.log('setTransport: after connect, isConnected =', isConnected);
        }

        // 断开连接
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            if (sse) {
                sse.close();
                sse = null;
            }
            isConnected = false;
        }

        // 清空显示（不发送 clear 命令）
        function clearChatDisplay() {
            const messagesEl = document.getElementById('messages');
            messagesEl.innerHTML = `
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <p>发送消息开始聊天</p>
                </div>
            `;
            welcomeShown = false;  // 重置欢迎句标志
        }

        // 连接 WebSocket
        function connect() {
            console.log('connect: called, currentTransport =', currentTransport);
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            statusEl.className = 'connection-status';
            statusText.textContent = '正在连接...';

            if (currentTransport === 'websocket') {
                connectWebSocket(statusEl, statusText);
            } else {
                // SSE 模式：获取欢迎消息
                isConnected = true;
                console.log('connect: SSE mode, fetching welcome');
                fetchWelcome();
            }
        }

        // 连接 WebSocket
        function connectWebSocket(statusEl, statusText) {
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('WebSocket connected');
                isConnected = true;
                statusEl.className = 'connection-status connected';
                statusText.textContent = '已连接';
                document.getElementById('sendBtn').disabled = false;
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };

            ws.onclose = function(event) {
                console.log('WebSocket closed:', event.code, event.reason);

                // 只有在仍然是 WebSocket 模式时才更新状态
                if (currentTransport === 'websocket') {
                    isConnected = false;
                    statusEl.className = 'connection-status';
                    statusText.textContent = '连接已断开 (code: ' + event.code + ')';
                    document.getElementById('sendBtn').disabled = true;

                    // 尝试重新连接
                    setTimeout(connectWebSocket, 3000);
                } else {
                    // 如果切换到 SSE 模式，保留 isConnected 状态
                    console.log('WebSocket closed but in SSE mode, keeping isConnected =', isConnected);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                statusEl.className = 'connection-status error';
                statusText.textContent = '连接错误';
            };
        }

        // 获取欢迎消息（SSE 模式）
        function fetchWelcome() {
            console.log('SSE: fetchWelcome called, welcomeShown =', welcomeShown);
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            statusEl.className = 'connection-status';
            statusText.textContent = '正在获取欢迎消息...';

            // 使用一个特殊的空消息来获取欢迎句
            const welcomeUrl = '/sse/chat?message=' + encodeURIComponent('__WELCOME__');
            console.log('SSE: creating EventSource for welcome with URL:', welcomeUrl);

            const welcomeSource = new EventSource(welcomeUrl);

            welcomeSource.onmessage = function(event) {
                console.log('SSE welcome: onmessage received:', event.data, 'welcomeShown =', welcomeShown);

                if (event.data === '[DONE]' || event.data.trim() === '[DONE]') {
                    welcomeSource.close();
                    return;
                }

                try {
                    const data = JSON.parse(event.data);
                    // 只处理 welcome 消息，忽略其他消息
                    if (data.type === 'welcome') {
                        // 通过 handleMessage 处理，以便正确设置 welcomeShown 标志
                        handleMessage(data);
                        welcomeSource.close();
                        statusEl.className = 'connection-status connected';
                        statusText.textContent = '已就绪 (SSE)';
                        console.log('SSE welcome: processed, welcomeShown =', welcomeShown);
                    }
                } catch (e) {
                    console.error('SSE welcome parse error:', e);
                }
            };

            welcomeSource.onerror = function(error) {
                console.error('SSE welcome: onerror fired:', error);
                welcomeSource.close();
                statusEl.className = 'connection-status connected';
                statusText.textContent = '已就绪 (SSE)';
            };
        }

        // 连接 SSE
        function connectSSE(message, statusEl, statusText) {
            console.log('SSE: connectSSE called with message:', message);
            console.log('SSE: currentTransport:', currentTransport);

            // 显示用户消息
            addMessage('user', message);

            // 不再预先调用 addTypingMessage()，"正在思考"由服务器发送的 status 消息触发

            statusEl.className = 'connection-status connected';
            statusText.textContent = '正在接收响应...';

            const sseUrl = '/sse/chat?message=' + encodeURIComponent(message);
            console.log('SSE: creating EventSource with URL:', sseUrl);

            const eventSource = new EventSource(sseUrl);
            sse = eventSource;

            eventSource.onopen = function() {
                console.log('SSE: onopen fired');
            };

            eventSource.onmessage = function(event) {
                console.log('SSE: onmessage received:', event.data);

                // 跳过 [DONE] 消息（SSE 协议结束信号）
                if (event.data === '[DONE]' || event.data.trim() === '[DONE]') {
                    console.log('SSE: received [DONE], stream finished');
                    eventSource.close();
                    sse = null;
                    return;
                }

                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('SSE parse error:', e);
                }
            };

            eventSource.onerror = function(error) {
                console.error('SSE: onerror fired:', error);
                console.log('SSE: readyState:', eventSource.readyState);
                eventSource.close();
                sse = null;
                statusEl.className = 'connection-status error';
                statusText.textContent = 'SSE 连接错误';
                document.getElementById('sendBtn').disabled = false;
            };

            // 自定义事件处理（用于处理更复杂的数据）
            eventSource.addEventListener('chunk', function(event) {
                console.log('SSE: chunk event:', event.data);
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('SSE chunk parse error:', e);
                }
            });
        }

        // 处理接收到的消息
        function handleMessage(data) {
            const messagesEl = document.getElementById('messages');

            // 移除空状态提示
            const emptyState = messagesEl.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            switch (data.type) {
                case 'welcome':
                    // 欢迎句只显示一次
                    if (!welcomeShown) {
                        addMessage('assistant', data.message);
                        welcomeShown = true;
                    }
                    break;

                case 'status':
                    // 显示正在思考的状态
                    messageCount++;
                    addTypingMessage();
                    break;

                case 'think':
                    // 实时接收思考内容
                    addThinkingContent(data.content);
                    break;

                case 'think_done':
                    // 思考完成信号，不再添加内容
                    break;

                case 'message':
                    // 旧的 message 类型，保留向后兼容，但不再添加内容（内容已通过 chunk 发送）
                    // 完成消息
                    finishMessage();
                    break;

                case 'message_done':
                    // 新增：消息完成信号（不再发送完整的 message 内容）
                    finishMessage();
                    break;

                case 'chunk':
                    // 实时接收回复内容
                    addResponseContent(data.content);
                    break;

                case 'error':
                    finishMessage();
                    addMessage('system', '错误: ' + data.message);
                    break;

                case 'system':
                    addMessage('system', data.message);
                    break;
            }

            scrollToBottom();
        }

        // 添加消息
        function addMessage(role, content) {
            const messagesEl = document.getElementById('messages');

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role;

            const avatar = role === 'user' ? '👤' : (role === 'system' ? '⚙️' : '🤖');

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;

            messagesEl.appendChild(messageDiv);
        }

        // 当前正在处理的消息
        let currentMessageDiv = null;
        let currentThinkingContent = null;
        let currentResponseContent = null;
        let currentThinkingIndicator = null;

        function addTypingMessage() {
            const messagesEl = document.getElementById('messages');

            // 创建消息框，包含思考区和回复区
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'message-' + messageCount;

            messageDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="thinking-indicator" onclick="toggleThinking(this)">
                        <span class="expand-icon">▶</span>
                        <div class="thinking-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <span>正在思考</span>
                    </div>
                    <div class="thinking-content"></div>
                    <div class="response-content"></div>
                </div>
            `;

            messagesEl.appendChild(messageDiv);
            currentMessageDiv = messageDiv;
            currentThinkingContent = messageDiv.querySelector('.thinking-content');
            currentResponseContent = messageDiv.querySelector('.response-content');
            currentThinkingIndicator = messageDiv.querySelector('.thinking-indicator');
        }

        // 切换思考内容显示/隐藏
        function toggleThinking(indicator) {
            const content = indicator.parentElement.querySelector('.thinking-content');
            const icon = indicator.querySelector('.expand-icon');
            content.classList.toggle('expanded');
            icon.classList.toggle('expanded');

            // 更新提示文字
            const textSpan = indicator.querySelector('span:last-child');
            if (content.classList.contains('expanded')) {
                textSpan.textContent = '点击收起思考';
            } else {
                textSpan.textContent = '点击查看思考';
            }
        }

        // 添加思考内容
        function addThinkingContent(text) {
            if (currentThinkingContent) {
                currentThinkingContent.textContent += text;
            }
        }

        // 添加回复内容
        function addResponseContent(text) {
            if (currentResponseContent) {
                currentResponseContent.innerHTML += escapeHtml(text);
            }
        }

        // 完成消息（思考和回复都完成后调用）
        function finishMessage() {
            if (!currentMessageDiv) return;

            const thinkingContent = currentMessageDiv.querySelector('.thinking-content');
            const thinkingText = thinkingContent ? thinkingContent.textContent : '';

            // 如果有思考内容，将"正在思考"改为可点击的"查看思考"
            if (currentThinkingIndicator && thinkingText) {
                const dots = currentThinkingIndicator.querySelector('.thinking-dots');
                const textSpan = currentThinkingIndicator.querySelector('span:last-child');

                // 移除动画点，改为静态图标
                if (dots) {
                    dots.style.display = 'none';
                }
                textSpan.textContent = '点击查看思考';
            }

            // 保持引用以便后续清理
            currentMessageDiv = null;
            currentThinkingContent = null;
            currentResponseContent = null;
            currentThinkingIndicator = null;
        }

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            console.log('sendMessage: message:', message);
            console.log('sendMessage: isConnected:', isConnected);
            console.log('sendMessage: currentTransport:', currentTransport);

            if (!message || !isConnected) {
                console.log('sendMessage: early return, message empty or not connected');
                return;
            }

            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            if (currentTransport === 'websocket') {
                console.log('sendMessage: using WebSocket');
                // 添加用户消息
                addMessage('user', message);

                // 发送消息到服务器
                ws.send(JSON.stringify({
                    type: 'message',
                    content: message
                }));
            } else {
                console.log('sendMessage: using SSE');
                // SSE 模式
                connectSSE(message, statusEl, statusText);
            }

            // 清空输入框
            input.value = '';

            scrollToBottom();
        }

        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 清空对话
        function clearChat() {
            if (currentTransport === 'websocket' && ws && isConnected) {
                ws.send(JSON.stringify({ type: 'clear' }));
            }

            clearChatDisplay();
        }

        // 滚动到底部
        function scrollToBottom() {
            const messagesEl = document.getElementById('messages');
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 页面加载时初始化 UI 并连接
        window.addEventListener('DOMContentLoaded', function() {
            initTransportUI();  // 应用保存的传输方式
            connect();
        });
    </script>
</body>
</html>
