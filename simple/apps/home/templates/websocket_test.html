<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
        }
        #messages {
            height: 300px;
            border: 1px solid #ddd;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            border-radius: 3px;
        }
        .sent {
            background: #e3f2fd;
            text-align: right;
        }
        .received {
            background: #f1f8e9;
        }
        .status {
            padding: 5px 10px;
            border-radius: 3px;
            margin-bottom: 10px;
        }
        .connected {
            background: #c8e6c9;
            color: #2e7d32;
        }
        .disconnected {
            background: #ffcdd2;
            color: #c62828;
        }
        .connecting {
            background: #fff9c4;
            color: #f9a825;
        }
        input[type="text"] {
            width: 70%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        button {
            padding: 8px 20px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #1565c0;
        }
        button:disabled {
            background: #ccc;
        }
    </style>
</head>
<body>
    <h1>WebSocket 测试</h1>
    <div class="container">
        <div id="status" class="status disconnected">未连接</div>
        <div id="messages"></div>
        <div>
            <input type="text" id="messageInput" placeholder="输入消息..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
            <button id="connectBtn" onclick="toggleConnection()" disabled>连接</button>
        </div>
    </div>

    <script>
        let ws = null;

        // 获取 WebSocket URL（自动使用当前主机）
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + '//' + window.location.host + '/ws/echo';

        document.getElementById('connectBtn').disabled = false;

        function updateStatus(status, className) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = status;
            statusEl.className = 'status ' + className;
        }

        function addMessage(text, type) {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + type;
            msgDiv.textContent = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function toggleConnection() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                ws.close();
            } else {
                connect();
            }
        }

        function connect() {
            updateStatus('连接中...', 'connecting');
            document.getElementById('connectBtn').disabled = true;

            console.log('[WebSocket JS] Connecting to:', wsUrl);

            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('[WebSocket JS] Connection opened!');
                updateStatus('已连接', 'connected');
                document.getElementById('connectBtn').textContent = '断开';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                addMessage('已连接到 ' + wsUrl, 'received');
            };

            ws.onmessage = function(event) {
                console.log('[WebSocket JS] Received:', event.data);
                addMessage('收到: ' + event.data, 'received');
            };

            ws.onclose = function(event) {
                console.log('[WebSocket JS] Connection closed!', 'code:', event.code, 'reason:', event.reason, 'wasClean:', event.wasClean);
                updateStatus('已断开', 'disconnected');
                document.getElementById('connectBtn').textContent = '连接';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                addMessage('连接已关闭 (code: ' + event.code + ')', 'received');
            };

            ws.onerror = function(error) {
                console.error('[WebSocket JS] Error:', error);
                addMessage('错误: ' + error, 'received');
                updateStatus('连接失败', 'disconnected');
                document.getElementById('connectBtn').textContent = '重试';
                document.getElementById('connectBtn').disabled = false;
            };
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (message && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
                addMessage('发送: ' + message, 'sent');
                input.value = '';
            }
        }

        // 按回车发送消息
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
