{{extend "layout.html"}}

{{block title}}WebSocket 测试 - Uliweb3 ASGI Demo{{end}}

{{block main}}
<div class="content">
    <h2 class="page-title">WebSocket 测试</h2>
    <p class="page-description">
        在此页面测试 WebSocket 实时通信功能。点击"连接"按钮建立 WebSocket 连接，
        然后可以发送消息进行测试。
    </p>

    <div class="ws-container">
        <div id="status" class="status disconnected">未连接</div>
        <div id="messages"></div>
        <div class="ws-input-area">
            <input type="text" id="messageInput" placeholder="输入消息..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
            <button id="connectBtn" onclick="toggleConnection()" disabled>连接</button>
        </div>
    </div>

    <div style="margin-top: 30px;">
        <a href="/" class="back-link">← 返回首页</a>
    </div>
</div>

<style>
.ws-container {
    border: 1px solid #e9ecef;
    padding: 20px;
    border-radius: 12px;
    background: #f8f9fa;
}
#messages {
    height: 300px;
    border: 1px solid #ddd;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 15px;
    background: white;
    border-radius: 8px;
}
.message {
    margin: 8px 0;
    padding: 10px;
    border-radius: 6px;
}
.sent {
    background: #e3f2fd;
    text-align: right;
}
.received {
    background: #f1f8e9;
}
.status {
    padding: 10px 15px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-weight: 600;
}
.connected {
    background: #c8e6c9;
    color: #2e7d32;
}
.disconnected {
    background: #ffcdd2;
    color: #c62828;
}
.connecting {
    background: #fff9c4;
    color: #f9a825;
}
.ws-input-area {
    display: flex;
    gap: 10px;
}
input[type="text"] {
    flex: 1;
    padding: 12px 15px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
}
input[type="text"]:focus {
    outline: none;
    border-color: #667eea;
}
button {
    padding: 12px 24px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
}
button:hover {
    background: #764ba2;
    transform: translateY(-2px);
}
button:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
}
</style>

<script>
        let ws = null;

        // 获取 WebSocket URL（自动使用当前主机）
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + '//' + window.location.host + '/ws/echo';

        document.getElementById('connectBtn').disabled = false;

        function updateStatus(status, className) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = status;
            statusEl.className = 'status ' + className;
        }

        function addMessage(text, type) {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + type;
            msgDiv.textContent = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function toggleConnection() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                ws.close();
            } else {
                connect();
            }
        }

        function connect() {
            updateStatus('连接中...', 'connecting');
            document.getElementById('connectBtn').disabled = true;

            console.log('[WebSocket JS] Connecting to:', wsUrl);

            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('[WebSocket JS] Connection opened!');
                updateStatus('已连接', 'connected');
                document.getElementById('connectBtn').textContent = '断开';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                addMessage('已连接到 ' + wsUrl, 'received');
            };

            ws.onmessage = function(event) {
                console.log('[WebSocket JS] Received:', event.data);
                addMessage('收到: ' + event.data, 'received');
            };

            ws.onclose = function(event) {
                console.log('[WebSocket JS] Connection closed!', 'code:', event.code, 'reason:', event.reason, 'wasClean:', event.wasClean);
                updateStatus('已断开', 'disconnected');
                document.getElementById('connectBtn').textContent = '连接';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                addMessage('连接已关闭 (code: ' + event.code + ')', 'received');
            };

            ws.onerror = function(error) {
                console.error('[WebSocket JS] Error:', error);
                addMessage('错误: ' + error, 'received');
                updateStatus('连接失败', 'disconnected');
                document.getElementById('connectBtn').textContent = '重试';
                document.getElementById('connectBtn').disabled = false;
            };
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (message && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
                addMessage('发送: ' + message, 'sent');
                input.value = '';
            }
        }

        // 按回车发送消息
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
{{end}}
